name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint, format check, typecheck (via Makefile)
        run: make lint format-check typecheck

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --all-extras
      # Single source of truth: same targets as local `make check`.
      # test-core also emits coverage.xml (Makefile COV reports term + xml)
      # which the codecov step below uploads.
      - name: Unit, integration, security and e2e tests (via Makefile)
        run: make test-core test-integration test-security test-e2e
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
      # Blocking now that the configuration provisions Firestore, Cloud Run,
      # KMS, Pub/Sub and IAM. init -backend=false needs no credentials.
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/
      - name: Terraform validate
        run: |
          cd infra/environments/hackathon
          terraform init -backend=false
          terraform validate
