[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delegation-fabric"
version = "0.1.0"
requires-python = ">=3.12"
description = "Deterministic, purpose-bound transaction authorization for enterprise AI agent fleets"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-ulid>=3.0.0",
    "cryptography>=43.0.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-kms>=3.0.0",
    "google-cloud-pubsub>=2.26.0",
    "google-cloud-storage>=2.18.0",
    "google-generativeai>=0.8.0",
    "google-cloud-aiplatform>=1.66.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-gcp-trace>=1.8.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "types-pyyaml>=6.0.12",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "SIM"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "packages"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages", "."]

# Coverage floor is enforced only on the core unit suite (make test-core / CI).
# Other suites run with --no-cov to avoid failing the floor on partial scope.
addopts = "--strict-markers -ra"

[tool.coverage.run]
source = ["packages/delegation_fabric_core"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["packages/delegation_fabric_core", "packages/delegation_fabric_adapters"]
